version = 1
SPDX-PackageName = "Calculator"
SPDX-PackageSupplier = "Saalim Quadri"
SPDX-PackageDownloadLocation = "https://github.com/PVOT-OSS/PvotCalculator"

[[annotations]]
path = [".gitignore", "app/.gitignore", "crcalc/.gitignore"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2014 The Android Open Source Project"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [".github/workflows/**"]
precedence = "aggregate"
SPDX-FileCopyrightText = "The LineageOS Project"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["gradle/wrapper/**", "gradlew*"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2007-2023 Gradle, Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = ["fastlane/metadata/android/**/*.txt", "fastlane/metadata/android/**/*.png", "app/lint-baseline.xml"]
precedence = "aggregate"
SPDX-FileCopyrightText = "Saalim Quadri <danascape@gmail.com>"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = "crcalc/src/**/*.java"
precedence = "aggregate"
SPDX-FileCopyrightText = ["2015 The Android Open Source Project", "1999 Silicon Graphics, Inc.", "2001-2002 Hewlett-Packard Company"]
SPDX-License-Identifier = "Apache-2.0 AND LicenseRef-CRCalc"
